<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FoodRush viewport harness</title>
<style>
  body { margin: 0; background: #23272e; font-family: sans-serif; }
  .label { color: #fff; font-size: 12px; padding: 4px 8px; }
  .frame-wrap { border: 2px solid #4a5058; border-radius: 8px; overflow: hidden; width: max-content; margin: 0 auto; }
  iframe { border: 0; display: block; background: #fff; }
</style>
</head>
<body>
<div class="label" id="label">…</div>
<div class="frame-wrap"><iframe id="f"></iframe></div>
<script>
  const params = new URLSearchParams(location.search);
  const route = params.get('route') || '/#/login';
  const mode = params.get('mode') || 'm';
  const [w, h] = mode === 'd' ? [1280, 800] : [390, 844];
  const f = document.getElementById('f');
  f.width = w; f.height = h;
  f.src = 'http://127.0.0.1:8080' + route;
  document.getElementById('label').textContent =
    (mode === 'd' ? 'DESKTOP 1280' : 'MOBILE 390') + ' — ' + route;
</script>
</body>
</html>
