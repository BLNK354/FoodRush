# Runs on every pull request and every push to main. Both jobs must pass
# before merging: they catch the kinds of bugs that have broken checkout on
# the live site (app/rules mismatches, rules that refuse real orders).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (analyze + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.2
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  rules:
    name: Security rules (normal use + attacks + app flows)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: firebase/tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firebase/tests/package-lock.json
      - run: npm ci
      - run: npm install -g firebase-tools
      # Emulator only (demo-* project): never touches the live Firebase project.
      - run: npm test
      - run: npm run test:flows
